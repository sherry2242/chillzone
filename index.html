<head>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sm-bg:#FFE1EE;
    --sm-card:#FFF3F8;
    --sm-text:#4A1030;
    --sm-text-soft:#8C5170;
    --sm-elevated:#E8407D;
    --sm-elevated-text:#FFF3F8;
    --sm-accent:#E8407D;
    --sm-border: rgba(74,16,48,0.12);
    --sm-chip-bg: rgba(74,16,48,0.06);
    --sm-chip-text:#8C5170;
  }

  body { background:var(--sm-bg); background-size:cover; background-position:center; background-attachment:fixed; color:var(--sm-text); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom: 40px; transition: background-color .4s ease, color .4s ease; }
  .font-display { font-family:'Baloo 2',sans-serif; font-weight:800; }
  .font-mono { font-family:'IBM Plex Mono',monospace; }
  .max-w { max-width: 900px; margin: 0 auto; }
  .px { padding-left: 16px; padding-right: 16px; }
  @media (min-width: 640px) { .px { padding-left: 24px; padding-right: 24px; } }

  .text-ink { color:var(--sm-text); }
  .text-soft { color:var(--sm-text-soft); }
  .icon-on-elevated { color:var(--sm-elevated-text); }

  header { position: sticky; top: 0; z-index: 30; background:var(--sm-bg); border-bottom: 1px solid var(--sm-border); transition: background-color .4s ease, border-color .4s ease; }
  .header-top { padding-top: 16px; }

  .search-row { display:flex; gap:10px; padding: 14px 0 4px; align-items:center; }
  .search-input-wrap { flex:1; position:relative; }
  .search-input-wrap i.fa-magnifying-glass { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--sm-text-soft); font-size:13px; }
  .search-input { width:100%; padding:11px 38px 11px 36px; border-radius:999px; border:1px solid var(--sm-border); background:var(--sm-card); font-family:'Inter',sans-serif; font-size:14px; color:var(--sm-text); outline:none; transition: background-color .4s ease, border-color .4s ease, color .4s ease; }
  .search-input:focus { border-color:var(--sm-accent); }
  .search-input::placeholder { color:var(--sm-text-soft); }
  .search-clear { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--sm-text-soft); display:none; }
  .surprise-btn { display:flex; align-items:center; gap:7px; background:#FFC93C; color:#4A1030; border:none; padding:11px 16px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; cursor:pointer; font-family:'IBM Plex Mono',monospace; letter-spacing:.02em; }
  .surprise-btn:hover { filter:brightness(1.05); }

  .view-tabs { display:flex; gap:8px; padding: 12px 0 4px; }
  .view-tab { display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; border:1px solid transparent; cursor:pointer; font-size:13px; font-weight:600; font-family:'Inter',sans-serif; background:transparent; transition: background-color .4s ease, color .4s ease, border-color .4s ease; }
  .view-tab-active { background:var(--sm-elevated); color:var(--sm-elevated-text); }
  .view-tab-inactive { background:transparent; color:var(--sm-text-soft); border-color:var(--sm-border); }

  .pills { display:flex; gap:8px; overflow-x:auto; padding: 12px 0 18px; scrollbar-width: thin; scrollbar-color: var(--sm-elevated) transparent; }
  .pills::-webkit-scrollbar { height:6px; }
  .pills::-webkit-scrollbar-track { background:transparent; }
  .pills::-webkit-scrollbar-thumb { background:var(--sm-elevated); border-radius:999px; }
  .pill { display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:999px; white-space:nowrap; flex-shrink:0; border:none; cursor:pointer; font-family:'Inter',sans-serif; font-size:14px; font-weight:600; transition: background-color .3s ease, color .3s ease; }
  .pill-active { background-color:var(--sm-elevated); color:var(--sm-elevated-text); }
  .pill-inactive { background-color:var(--sm-card); color:var(--sm-text-soft); }
  .pill-inactive:hover { filter:brightness(0.96); }

  .trend-period-row { display:flex; gap:8px; padding: 12px 0 12px; }
  .trend-period { font-family:'IBM Plex Mono',monospace; font-size:12px; padding:7px 13px; border-radius:999px; border:1px solid var(--sm-border); background:var(--sm-card); cursor:pointer; color:var(--sm-text-soft); }
  .trend-period-active { background:#E8407D; color:#FFF3F8; border-color:#E8407D; }

  main { padding: 20px 0 112px; }
  .cat-heading { margin-bottom: 16px; }
  .cat-heading h2 { font-size: 28px; }
  .cat-heading p { color:var(--sm-text-soft); font-size: 14px; }

  .grid { display:grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card { background:var(--sm-card); border:1px solid var(--sm-border); border-radius:18px; padding:16px; position:relative; cursor:pointer; transition: transform .2s ease, box-shadow .2s ease, background-color .4s ease, border-color .4s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(74,16,48,0.14); }
  .ribbon { position:absolute; top:-8px; left:16px; background:#FFC93C; color:#4A1030; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.05em; padding: 2px 8px; border-radius:6px; }
  .rank-badge { position:absolute; top:-10px; left:16px; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; color:#FFF3F8; background:#4A1030; }
  .rank-badge.gold { background:#FFC93C; color:#4A1030; }

  .card-body { display:flex; gap:12px; }
  .card-info { flex:1; min-width:0; }
  .card-info h3 { font-size:18px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-info .desc { color:var(--sm-text-soft); font-size:14px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:2px; }
  .tag-row { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .tag-chip { font-family:'IBM Plex Mono',monospace; font-size:10px; background:var(--sm-chip-bg); color:var(--sm-chip-text); padding:2px 8px; border-radius:999px; }
  .trend-line { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#E8407D; margin-top:6px; display:flex; align-items:center; gap:5px; }

  .variant-toggle { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .variant-btn { flex:1; min-width:64px; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 6px; border-radius:8px; border:1px solid var(--sm-border); background:var(--sm-bg); color:var(--sm-text-soft); cursor:pointer; text-align:center; }
  .variant-active { background:var(--sm-elevated) !important; color:var(--sm-elevated-text) !important; border-color:var(--sm-elevated) !important; }

  .price-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .price { font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--sm-accent); font-weight:700; }

  .add-btn { display:flex; align-items:center; gap:6px; background:var(--sm-elevated); color:var(--sm-elevated-text); font-size:14px; padding:7px 14px; border-radius:999px; border:none; cursor:pointer; font-weight:600; }
  .stepper { display:flex; align-items:center; gap:2px; background:var(--sm-elevated); border-radius:999px; padding:4px; }
  .stepper button { width:28px; height:28px; display:flex; align-items:center; justify-content:center; background:none; border:none; color:var(--sm-elevated-text); cursor:pointer; }
  .stepper span { font-family:'IBM Plex Mono',monospace; color:var(--sm-elevated-text); font-size:14px; width:18px; text-align:center; }

  .empty-state { text-align:center; padding:56px 0; color:var(--sm-text-soft); grid-column: 1 / -1; }
  .empty-state i { font-size:26px; margin-bottom:10px; display:block; color:var(--sm-text-soft); }
  .empty-state p { font-size:14px; max-width:320px; margin:0 auto; }

  .fab { position:fixed; bottom:20px; right:20px; z-index:40; background:#4A1030; color:#FFF3F8; border:none; border-radius:999px; padding: 12px 20px 12px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .fab .bag-wrap { position:relative; }
  .fab .count { position:absolute; top:-10px; right:-10px; background:#FFC93C; color:#4A1030; font-family:'IBM Plex Mono',monospace; font-size:11px; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .fab .total { font-family:'IBM Plex Mono',monospace; font-size:14px; }

  .backdrop { position:fixed; inset:0; background:rgba(74,16,48,0.5); z-index:45; display:none; }
  .backdrop.show { display:block; }

  .modal-wrap { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:16px; }
  .modal-wrap.show { display:flex; }
  .modal { background:var(--sm-card); color:var(--sm-text); border-radius:24px; width:100%; max-width:420px; padding:24px; position:relative; max-height:88vh; overflow-y:auto; transition: background-color .4s ease, color .4s ease; }
  .modal-close { position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; background:var(--sm-bg); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--sm-text); }
  .modal-ribbon { display:inline-block; background:#FFC93C; color:#4A1030; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; padding:4px 10px; border-radius:6px; margin-bottom:14px; }
  .modal-art-wrap { display:flex; justify-content:center; margin-bottom:16px; }
  .modal-header h2 { font-size:24px; line-height:1.15; text-align:center; }
  .modal-desc { font-size:14px; text-align:center; margin-top:6px; }
  .modal-price-row { display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px; }
  .modal-price { font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--sm-accent); font-weight:700; }
  .modal-add-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--sm-elevated); color:var(--sm-elevated-text); font-size:14px; padding:12px; border-radius:999px; border:none; cursor:pointer; margin-top:16px; font-weight:600; }
  .modal-stepper { display:flex; align-items:center; justify-content:space-between; background:var(--sm-elevated); border-radius:999px; padding:8px; margin-top:16px; }
  .modal-stepper button { width:32px; height:32px; background:none; border:none; color:var(--sm-elevated-text); cursor:pointer; }
  .modal-stepper span { font-family:'IBM Plex Mono',monospace; color:var(--sm-elevated-text); font-size:14px; }

  .drawer { position:fixed; z-index:55; right:0; top:0; bottom:0; width:100%; max-width:384px; background:#4A1030; color:#FFF3F8; transform:translateX(100%); transition: transform .3s ease-out; max-height:100vh; overflow-y:auto; }
  .drawer.open { transform:translateX(0); }
  @media (max-width: 639px) {

  .drawer-inner { padding: 24px 20px 20px 20px; }
  .drawer-head { display:flex; align-items:center; justify-content:space-between; }
  .drawer-head h2 { font-size:22px; }
  .drawer-close { background:none; border:none; color:#FFF3F8; cursor:pointer; }
  .drawer-divider { border-top:1px dashed rgba(255,243,248,0.25); margin: 16px 0; }
  .cart-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .cart-row .name { font-size:14px; font-weight:600; }
  .cart-row .unit { font-family:'IBM Plex Mono',monospace; font-size:12px; color:#D9A9C0; }
  .cart-stepper { display:flex; align-items:center; gap:2px; border:1px solid rgba(255,243,248,0.25); border-radius:999px; padding:4px; }
  .cart-stepper button { width:26px; height:26px; background:none; border:none; color:#FFFFFF; cursor:pointer; }
  .cart-stepper span { font-family:'IBM Plex Mono',monospace; font-size:12px; width:16px; text-align:center; color:#FFF3F8; }
  .line-total { font-family:'IBM Plex Mono',monospace; font-size:14px; width:56px; text-align:right; }
  .subtotal-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .subtotal-row span:first-child { font-family:'IBM Plex Mono',monospace; font-size:13px; color:#D9A9C0; }
  .subtotal-row span:last-child { font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; }
  .bill-note { font-size:12px; color:#D9A9C0; margin-bottom:16px; }
  .send-btn { width:100%; background:#E8407D; color:#FFF3F8; font-family:'IBM Plex Mono',monospace; font-size:13px; text-transform:uppercase; letter-spacing:.05em; padding:12px; border-radius:12px; border:none; cursor:pointer; font-weight:700; }
  .empty-cart { padding: 40px 0; text-align:center; }
  .empty-cart i { font-size:28px; color:#D9A9C0; margin-bottom:12px; display:block; }
  .empty-cart p { font-size:14px; color:#D9A9C0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; animation:none !important; }
  }

.site-footer { text-align:center; padding:32px 16px 24px; } .site-footer h3 { font-size:16px; margin-bottom:6px; } .site-footer p { font-size:13px; color:var(--sm-text-soft); margin-bottom:16px; } .footer-btns { display:flex; justify-content:center; gap:16px; } .footer-btn { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; text-decoration:none; } .footer-btn.call { background:#4A1030; } .footer-btn.whatsapp { background:#25D366; }

</style>

  function applyTheme(key) {
    const t = THEMES[key] || THEMES.scoops;
    const cat = CATEGORIES.find(c => c.id === key);
    const root = document.documentElement.style;
    root.setProperty("--sm-bg", t.bg);
    root.setProperty("--sm-card", t.card);
    root.setProperty("--sm-text", t.text);
    root.setProperty("--sm-text-soft", t.textSoft);
    root.setProperty("--sm-elevated", t.elevated);
    root.setProperty("--sm-elevated-text", t.elevatedText);
    root.setProperty("--sm-accent", t.accent);
    root.setProperty("--sm-border", t.border);
    root.setProperty("--sm-chip-bg", t.chipBg);
    root.setProperty("--sm-chip-text", t.chipText);
    if (cat && cat.bgImage) {
      document.body.style.backgroundImage = `linear-gradient(${t.bg}CC, ${t.bg}CC), url('${cat.bgImage}')`;
    } else {
      document.body.style.backgroundImage = "none";
    }
  }

  // Paste your "Publish to web" CSV link here to load the menu from a Google Sheet

  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSfp10We26MxaRbhCK6C2VouWEfYWPRF4bOpRTeuMH4L2cvlXoTzdhsEQRbZYfBAdGY8ZguY8YYG2QY/pub?gid=0&single=true&output=csv";

  function splitCSVLine(line) {
    const result = []; let cur = ""; let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === "," && !inQuotes) { result.push(cur); cur = ""; }
      else { cur += ch; }
    }
    result.push(cur);
    return result.map(s => s.trim());
  }

  function parseCSV(text) {    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) return [];
    const headers = splitCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const cols = splitCSVLine(line);
      const row = {};
      headers.forEach((h, idx) => { row[h] = cols[idx] || ""; });
      return row;
    });
  }

  function itemsFromRows(rows) {
    return rows.map(r => {
      const variants = [];
      for (let n = 1; n <= 3; n++) {
        const label = r["variant" + n + "_label"];
        const price = r["variant" + n + "_price"];
        if (label) variants.push({ label, price: parseFloat(price) || 0 });
      }
      const item = {
        id: r.id,
        category: r.category,
        image: r.image || "",
        name: r.name,
        desc: r.desc || "",
        tags: (r.tags || "").split(";").map(t => t.trim()).filter(Boolean),
        ordersToday: parseInt(r.ordersToday, 10) || 0,
        ordersWeek: parseInt(r.ordersWeek, 10) || 0,
        ordersAllTime: parseInt(r.ordersAllTime, 10) || 0,
      };
      if (variants.length) item.variants = variants;
      else item.price = parseFloat(r.price) || 0;
      return item;
    }).filter(i => i.id && i.category && i.name);
  }

  async function loadMenuFromSheet() {
    if (!SHEET_CSV_URL) { renderAll(); return; }
    try {
      const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("Sheet fetch failed: " + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      const items = itemsFromRows(rows);
      if (items.length > 0) ITEMS = items;
    } catch (e) {
      console.warn("Could not load menu from Google Sheet — using the built-in fallback menu instead.", e);
    }
    renderAll();
  }

  let state = {
    view: "browse",
    category: "scoops",
    searchQuery: "",

    cart: {},
    variantChoice: {},

    billCalculated: false,
    selectedId: null,
    surpriseMode: false,
  };

  function catColor(id) { const c = CATEGORIES.find(c => c.id === id); return c ? c.color : "#E8407D"; }
  function getVariants(item) { return item.variants || [{ label: "", price: item.price }]; }
  function getVariantIdx(id) { return state.variantChoice[id] || 0; }
  function setVariant(id, idx) { state.variantChoice[id] = idx; renderAll(); }
  function cartKey(id, vIdx) { return id + "::" + (vIdx || 0); }
  function priceFor(item, vIdx) { return getVariants(item)[vIdx || 0].price; }

  function getCartEntries() {
    return Object.keys(state.cart).map(key => {
      const parts = key.split("::");
      const id = parts[0], vIdx = parseInt(parts[1] || "0", 10);
      const item = ITEMS.find(i => i.id === id);
      if (!item) return null;
      return { item, vIdx, qty: state.cart[key], unitPrice: priceFor(item, vIdx), key };
    }).filter(Boolean);
  }

  function dishArtHTML(item, size) {
    const color = catColor(item.category);
    if (item.image) {
      return `<img src="${item.image}" alt="${item.name}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;border:2px solid ${color};flex-shrink:0;" />`;
    }
    const cat = CATEGORIES.find(c => c.id === item.category);
    const icon = cat ? cat.icon : "fa-ice-cream";
    return `<div style="width:${size}px;height:${size}px;border:2px dashed ${color};background-color:var(--sm-card);background-image:radial-gradient(${color}33 1.4px, transparent 1.4px);background-size:9px 9px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;">
      <i class="fa-solid ${icon}" style="color:${color};font-size:${size*0.38}px"></i>
    </div>`;
  }

  function variantToggleHTML(item) {
    const variants = getVariants(item);
    if (variants.length < 2) return "";
    const active = getVariantIdx(item.id);
    return `
      <div class="variant-toggle" onclick="event.stopPropagation()">
        ${variants.map((v, i) => `<button class="variant-btn ${i===active?'variant-active':''}" onclick="setVariant('${item.id}',${i})">${v.label} · ₹${v.price}</button>`).join("")}
      </div>
    `;
  }

  function matchesQuery(item, q) {
    const nq = q.toLowerCase().trim();
    if (!nq) return true;
    if (item.name.toLowerCase().includes(nq)) return true;
    if (item.desc.toLowerCase().includes(nq)) return true;
    if (item.tags.some(t => t.toLowerCase().includes(nq))) return true;
    if (nq.includes("today") || nq.includes("best today")) {
      const topToday = [...ITEMS].sort((a,b)=>b.ordersToday-a.ordersToday).slice(0,5).map(i=>i.id);
      if (topToday.includes(item.id)) return true;
    }
    if (nq.includes("trending") || nq.includes("popular")) {
      const topAll = [...ITEMS].sort((a,b)=>b.ordersAllTime-a.ordersAllTime).slice(0,5).map(i=>i.id);
      if (topAll.includes(item.id)) return true;
    }
    return false;
  }

  function trendKey(period) {
    return period === "today" ? "ordersToday" : period === "week" ? "ordersWeek" : "ordersAllTime";
  }
  function trendLabelText(period) {
    return period === "today" ? "today" : period === "week" ? "this week" : "all-time";
  }

  function dishCardHTML(item, opts = {}) {
    const vIdx = getVariantIdx(item.id);
    const qty = state.cart[cartKey(item.id, vIdx)] || 0;
    const rank = opts.rank || null;
    const trendCount = opts.trendCount != null ? opts.trendCount : null;
    const trendLbl = opts.trendLabel || "";
    const displayPrice = priceFor(item, vIdx);
    return `
      <div class="card" onclick="openItem('${item.id}')">
        ${rank ? `<span class="rank-badge ${rank===1?'gold':''}">#${rank}</span>` : ""}
        <div class="card-body">
          ${dishArtHTML(item, 58)}
          <div class="card-info">
            <h3 class="font-display">${item.name}</h3>
            <p class="desc">${item.desc}</p>
            ${trendCount != null ? `<div class="trend-line"><i class="fa-solid fa-fire" style="font-size:10px;"></i> ${trendCount} orders ${trendLbl}</div>` : `
              <div class="tag-row">${item.tags.slice(0,3).map(t => `<span class="tag-chip">${t}</span>`).join("")}</div>
            `}
          </div>
        </div>
        ${variantToggleHTML(item)}
        <div class="price-row">
          <span class="price">₹${displayPrice}</span>
          ${qty > 0 ? `
            <div class="stepper" onclick="event.stopPropagation()">
              <button onclick="removeItem('${item.id}',${vIdx})"><i class="fa-solid fa-minus icon-on-elevated" style="font-size:12px;"></i></button>
              <span>${qty}</span>
              <button onclick="addItem('${item.id}',${vIdx})"><i class="fa-solid fa-plus icon-on-elevated" style="font-size:12px;"></i></button>
            </div>
          ` : `
            <button class="add-btn" onclick="event.stopPropagation(); addItem('${item.id}',${vIdx})"><i class="fa-solid fa-plus icon-on-elevated" style="font-size:12px;"></i> Add</button>
          `}
        </div>
      </div>
    `;
  }

  function renderHeaderNav() {
    const searchActive = !!state.searchQuery;
    document.getElementById("viewTabs").innerHTML = `
      <button class="view-tab ${state.view==='browse' && !searchActive ? 'view-tab-active':'view-tab-inactive'}" onclick="setView('browse')"><i class="fa-solid fa-ice-cream" style="font-size:11px;"></i> Browse Menu</button>
      <button class="view-tab ${state.view==='trending' && !searchActive ? 'view-tab-active':'view-tab-inactive'}" onclick="setView('trending')"><i class="fa-solid fa-fire" style="font-size:11px;"></i> Trending</button>
    `;

    const subNav = document.getElementById("subNav");
    if (searchActive) { subNav.innerHTML = ""; return; }

    if (state.view === "browse") {
      subNav.innerHTML = `<div class="pills" id="pills"></div>`;
      document.getElementById("pills").innerHTML = CATEGORIES.map(cat => `
        <button class="pill ${state.category === cat.id ? "pill-active" : "pill-inactive"}" onclick="setCategory('${cat.id}')">
          <i class="fa-solid ${cat.icon}" style="font-size:13px;"></i>
          <span>${cat.label}</span>
        </button>
      `).join("");
    } else {
      subNav.innerHTML = `
        <div class="trend-period-row">
          <button class="trend-period ${state.trendPeriod==='today'?'trend-period-active':''}" onclick="setTrendPeriod('today')">Last 24 Hours</button>
          <button class="trend-period ${state.trendPeriod==='week'?'trend-period-active':''}" onclick="setTrendPeriod('week')">This Week</button>
          <button class="trend-period ${state.trendPeriod==='all'?'trend-period-active':''}" onclick="setTrendPeriod('all')">All Time</button>
        </div>
      `;
    }
  }

  function renderMainContent() {
    const titleEl = document.getElementById("catTitle");
    const subEl = document.getElementById("catSub");
    const grid = document.getElementById("menuGrid");
    let items = [];
    let rankMode = false;
    const period = state.trendPeriod;

    if (state.searchQuery) {
      items = ITEMS.filter(i => matchesQuery(i, state.searchQuery));
      titleEl.textContent = "Search Results";
      subEl.textContent = `"${state.searchQuery}" · ${items.length} item${items.length===1?"":"s"} found`;
    } else if (state.view === "trending") {
      const key = trendKey(period);
      items = [...ITEMS].sort((a,b) => b[key]-a[key]).slice(0,8);
      rankMode = true;
      titleEl.textContent = "Trending";
      subEl.textContent = period==="today" ? "Most ordered in the last 24 hours" : period==="week" ? "Most ordered this week" : "All-time favourites";
    } else {
      const cat = CATEGORIES.find(c => c.id === state.category) || CATEGORIES[0];
      items = ITEMS.filter(i => i.category === state.category);
      titleEl.textContent = cat.label;
      subEl.textContent = "";
    }

    if (items.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-magnifying-glass"></i>
          <p>No items match "${state.searchQuery}". Try "chocolatey", "fruity", "best today" or an item name.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = items.map((item, idx) => {
      if (!rankMode) return dishCardHTML(item);
      const key = trendKey(period);
      return dishCardHTML(item, { rank: idx+1, trendCount: item[key], trendLabel: trendLabelText(period) });
    }).join("");
  }

  function renderFab() {
    const entries = getCartEntries();
    const count = entries.reduce((s,e) => s+e.qty, 0);
    const subtotal = entries.reduce((s,e) => s + e.qty*e.unitPrice, 0);
    const fab = document.getElementById("fab");
    fab.style.display = (count > 0 && !state.cartOpen) ? "flex" : "none";
    document.getElementById("fabCount").textContent = count;
    document.getElementById("fabTotal").textContent = "₹" + subtotal;
  }

  function renderModal() {
    const wrap = document.getElementById("modalWrap");
    const backdrop = document.getElementById("modalBackdrop");
    const item = ITEMS.find(i => i.id === state.selectedId);
    if (!item) { wrap.classList.remove("show"); backdrop.classList.remove("show"); return; }
    wrap.classList.add("show"); backdrop.classList.add("show");
    const vIdx = getVariantIdx(item.id);
    const qty = state.cart[cartKey(item.id, vIdx)] || 0;
    const displayPrice = priceFor(item, vIdx);
    document.getElementById("modalContent").innerHTML = `
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark" style="font-size:15px;"></i></button>
      ${state.surpriseMode ? `<div class="modal-ribbon">✨ SURPRISE PICK</div>` : ""}
      <div class="modal-art-wrap">${dishArtHTML(item, 96)}</div>
      <div class="modal-header"><h2 class="font-display">${item.name}</h2></div>
      <p class="modal-desc text-soft">${item.desc}</p>
      <div class="modal-price-row"><span class="modal-price">₹${displayPrice}</span></div>
      ${getVariants(item).length > 1 ? `<div style="margin-top:14px;">${variantToggleHTML(item)}</div>` : ""}
      ${qty > 0 ? `
        <div class="modal-stepper">
          <button onclick="removeItem('${item.id}',${vIdx})"><i class="fa-solid fa-minus icon-on-elevated"></i></button>
          <span>${qty} added</span>
          <button onclick="addItem('${item.id}',${vIdx})"><i class="fa-solid fa-plus icon-on-elevated"></i></button>
        </div>
      ` : `
        <button class="modal-add-btn" onclick="addItem('${item.id}',${vIdx})"><i class="fa-solid fa-plus icon-on-elevated" style="font-size:13px;"></i> Add to Order</button>
      `}
    `;
  }

  function renderDrawer() {
    const drawer = document.getElementById("drawer");
    const backdrop = document.getElementById("cartBackdrop");
    drawer.classList.toggle("open", state.cartOpen);
    backdrop.classList.toggle("show", state.cartOpen);

    const entries = getCartEntries();
    const subtotal = entries.reduce((s,e) => s + e.qty*e.unitPrice, 0);
    const body = document.getElementById("drawerBody");

    if (entries.length === 0) {
      body.innerHTML = `
        <div class="empty-cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <p>Your order is empty. Add something tasty from the menu.</p>
        </div>
      `;
      return;
    }

    if (state.billCalculated) {
      body.innerHTML = `
        ${entries.map(e => {
          const variants = getVariants(e.item);
          const vLabel = variants.length > 1 ? ` (${variants[e.vIdx].label})` : "";
          return `
          <div class="cart-row">
            <div style="flex:1;">
              <p class="name">${e.item.name}${vLabel}</p>
              <p class="unit">₹${e.unitPrice} × ${e.qty}</p>
            </div>
            <span class="line-total">₹${e.unitPrice * e.qty}</span>
          </div>
        `; }).join("")}
        <div class="drawer-divider"></div>
        <div class="subtotal-row"><span>TOTAL TO PAY</span><span>₹${subtotal}</span></div>
        <p class="bill-note">Please pay this amount at the counter.</p>
        <button class="send-btn" onclick="editOrder()">Edit Order</button>
      `;
      return;
    }

    body.innerHTML = `
      ${entries.map(e => {
        const variants = getVariants(e.item);
        const vLabel = variants.length > 1 ? ` (${variants[e.vIdx].label})` : "";
        return `
        <div class="cart-row">
          <div style="flex:1;">
            <p class="name">${e.item.name}${vLabel}</p>
            <p class="unit">₹${e.unitPrice} × ${e.qty}</p>
          </div>
          <div class="cart-stepper">
            <button onclick="removeItem('${e.item.id}',${e.vIdx})"><i class="fa-solid fa-minus" style="font-size:11px;"></i></button>
            <span>${e.qty}</span>
            <button onclick="addItem('${e.item.id}',${e.vIdx})"><i class="fa-solid fa-plus" style="font-size:11px;"></i></button>
          </div>
          <span class="line-total">₹${e.unitPrice * e.qty}</span>
        </div>
      `; }).join("")}
      <div class="drawer-divider"></div>
      <div class="subtotal-row"><span>SUBTOTAL</span><span>₹${subtotal}</span></div>
      <p class="bill-note">&nbsp;</p>
      <button class="send-btn" onclick="calculateBill()">Calculate Bill</button>
    `;
  }

  function renderAll() {
    const themeKey = (state.searchQuery || state.view === "trending") ? "scoops" : state.category;
    applyTheme(themeKey);
    renderHeaderNav();
    renderMainContent();
    renderFab();
    renderModal();
    renderDrawer();
  }

  function setView(v) {
    state.view = v;
    state.searchQuery = "";
    document.getElementById("searchInput").value = "";
    document.getElementById("searchClearBtn").style.display = "none";
    renderAll();
  }
  function setCategory(id) {
    state.category = id;
    renderAll();
    // Keep the just-selected category pill in view instead of the row snapping back to the start.
    const activeBtn = document.querySelector(".pill-active");
    if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }
  function setTrendPeriod(p) { state.trendPeriod = p; renderAll(); }
  function handleSearch(v) {
    state.searchQuery = v;
    document.getElementById("searchClearBtn").style.display = v ? "block" : "none";
    renderAll();
  }
  function clearSearch() {
    state.searchQuery = "";
    document.getElementById("searchInput").value = "";
    document.getElementById("searchClearBtn").style.display = "none";
    renderAll();
  }
  function addItem(id, vIdx) {
    const key = cartKey(id, vIdx != null ? vIdx : getVariantIdx(id));
    state.cart[key] = (state.cart[key] || 0) + 1;
    renderAll();
  }
  function removeItem(id, vIdx) {
    const key = cartKey(id, vIdx != null ? vIdx : getVariantIdx(id));
    if (state.cart[key] <= 1) delete state.cart[key]; else state.cart[key]--;
    renderAll();
  }
  function openItem(id, surprise) {
    state.selectedId = id;
    state.surpriseMode = !!surprise;
    renderAll();
  }
  function closeModal() { state.selectedId = null; state.surpriseMode = false; renderAll(); }
  function surpriseMe() {
    const idx = Math.floor(Math.random() * ITEMS.length);
    openItem(ITEMS[idx].id, true);
  }
  function toggleCart(open) { state.cartOpen = open; renderAll(); }
  function calculateBill() { state.billCalculated = true; renderAll(); }
  function editOrder() { state.billCalculated = false; renderAll(); }

  loadMenuFromSheet();
</script>
</body>
</html>
